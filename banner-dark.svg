<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='320' viewBox='0 0 1280 320' role='img' aria-label='Arun K. Senior Android Developer building offline-first Android systems'><style>.m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.s{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.cur{animation:b 1.1s steps(1) infinite}@keyframes b{50%{opacity:0}}.bar{animation:g 3.2s ease-in-out infinite alternate}@keyframes g{from{width:170px}to{width:250px}}.dot{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.3}}@media (prefers-reduced-motion:reduce){.cur,.bar,.dot{animation:none}}</style><rect width='1280' height='320' fill='#0E110C'/><g fill='none' stroke='#7ED6A0' stroke-opacity='.07' stroke-width='1.5'><path d='M-20 70 C 160 20 320 120 520 60 S 860 10 1300 80'/><path d='M-20 120 C 180 70 340 170 560 110 S 900 60 1300 130'/><path d='M-20 250 C 200 200 380 300 600 240 S 940 190 1300 260'/><path d='M-20 300 C 220 250 400 350 640 290 S 980 240 1300 310'/><path d='M640 150 c 40 -40 120 -40 150 0 s -20 80 -80 70 s -110 -30 -70 -70 z'/><path d='M660 155 c 30 -26 90 -26 110 0 s -16 52 -60 46 s -80 -20 -50 -46 z'/></g><rect x='64' y='30' width='420' height='28' rx='14' fill='#161A12' stroke='#2B331F'/><circle class='dot' cx='82' cy='44' r='4' fill='#7ED6A0'/><text x='94' y='48.5' class='m' font-size='12' letter-spacing='.8' fill='#9BA58B'>OPEN TO OPPORTUNITIES <tspan fill='#6C7660'>/</tspan> 4.7+ YRS <tspan fill='#6C7660'>/</tspan> POLLACHI, TN</text><text x='64' y='100' class='m' font-size='14' font-weight='600' letter-spacing='2.4' fill='#E7A23C'>SENIOR ANDROID DEVELOPER</text><text x='60' y='168' class='m' font-size='70' font-weight='800' letter-spacing='-2' fill='#ECE9DD'>Arun <tspan fill='#E7A23C'>K.</tspan></text><text x='64' y='208' class='s' font-size='19' fill='#9BA58B'>I build <tspan font-weight='700' fill='#7ED6A0'>offline-first</tspan> Android systems that keep working</